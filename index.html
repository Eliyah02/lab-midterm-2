<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Dynamic Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>Secure Dynamic Task Manager</h1>

    <form id="taskForm" onsubmit="return false">
      <input type="text" id="taskInput" placeholder="Enter a task">
      <button id="addTaskBtn" type="button">Add Task</button>
      <button id="loadSamplesBtn" type="button">Load Sample Tasks</button>
    </form>

    <p id="taskMessage"></p>

    <div class="counts">
      <span>Total Tasks: <span id="totalCount">0</span></span>
      <span>Pending: <span id="pendingCount">0</span></span>
      <span>Completed: <span id="completedCount">0</span></span>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
